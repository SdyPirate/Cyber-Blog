<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台登录 | Big B Bro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'header': ['Orbitron', 'sans-serif'], 'mono': ['"JetBrains Mono"', 'monospace'] },
                    colors: { 'neon-blue': '#00f2ff', 'neon-purple': '#bc13fe', 'dark-bg': '#050505' }
                }
            }
        }
    </script>
    <style>
        body {
            background: #050505;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #050505 60%);
        }

        .glow-box {
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center font-mono text-white">
    <div class="w-full max-w-md p-8">
        <div class="bg-slate-900/90 rounded-2xl border border-neon-blue/30 p-8 glow-box">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold font-header text-neon-blue mb-2">ADMIN ACCESS</h1>
                <p class="text-slate-500 text-sm">后台管理系统</p>
            </div>

            <form action="/admin/auth" method="POST" class="space-y-6">
                <div>
                    <label class="block text-xs text-slate-400 uppercase mb-2">用户名</label>
                    <input type="text" name="username" required
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-neon-blue focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 uppercase mb-2">密码</label>
                    <input type="password" name="password" required
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-neon-blue focus:outline-none transition">
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-neon-blue to-neon-purple text-black font-bold py-3 rounded-lg hover:opacity-90 transition transform hover:scale-[1.02]">
                    登 录
                </button>
            </form>

            <script>
                if (window.location.search.includes('error=1')) {
                    const form = document.querySelector('form');
                    const error = document.createElement('div');
                    error.className = 'mt-4 p-3 bg-red-500/20 border border-red-500/50 rounded text-red-400 text-sm text-center';
                    error.textContent = '用户名或密码错误';
                    form.appendChild(error);
                }
            </script>

            <div class="text-center mt-6">
                <a href="/" class="text-slate-500 text-sm hover:text-neon-blue transition">← 返回首页</a>
            </div>
        </div>

        <div class="text-center mt-6 text-slate-600 text-xs font-mono">
            SECURE CONNECTION ESTABLISHED
        </div>
    </div>
</body>

</html>
